name: ci

# Typecheck, test and build on every pull request and every push to main, on Node 22 and 24; then refuse a
# weakened hostile verdict or an unnamed golden move (the ratchet), and install the packed tarball in a
# throwaway project and run the corpus through its public entries (the consumer smoke). The ratchet's base is
# the pull request's base branch; on a push, main's tip before the push, so every commit the push adds is read
# (HEAD^ only for a push that has no previous tip); by hand, origin/main.
# The token is read-only; a later job that needs more asks for it in its own diff. The checkout keeps no
# credentials in the workspace (the ratchet needs history, not a token), so no later step can push with one.
# The layout tests (test/browser/) run in real browsers: the pinned playwright-core installs its Chromium and
# WebKit builds and their system libraries first, and both run (DOCREADER_BROWSERS is never set here); a run that
# leaves conformance/layout/ changed (an expected snapshot written by the tests) fails.
# The browser install must not hang the job on a stalling package mirror: apt retries and gives up on a silent
# connection after 30 seconds, the browser builds come from a cache keyed on the runner and the pinned
# playwright-core version, and the install runs at most twice, each attempt bounded, inside its own step timeout.
# The key names the runner's architecture and OS release (the ID and VERSION_ID of /etc/os-release), because
# playwright-core picks its browser builds by those and never re-downloads a build it finds restored: a key
# without them would restore builds made for the previous release once ubuntu-latest moves.
# The cached directory is the one playwright-core installs into on Linux: $XDG_CACHE_HOME/ms-playwright, or
# .cache/ms-playwright under $HOME when XDG_CACHE_HOME is unset.
# The system libraries --with-deps installs are cached too, so a warm job downloads no .deb: apt's archive
# directory is moved, through the same apt configuration file, to a runner-owned directory under RUNNER_TEMP (its
# partial/ made before the install), which a second cache step restores and saves under its own key on the same
# inputs; apt writes there as root, so a step after the install hands the directory back to the runner for the save.
# An attempt's timeout cannot stop the apt-get it started under sudo, which then holds the dpkg lock; so before the
# second attempt only, a leftover apt-get or dpkg is stopped by exact name (TERM, then KILL after a short wait) and
# dpkg finishes any configuration the first attempt interrupted.
# Every remote action is pinned by full commit sha, its release tag in the trailing comment; this workflow holds
# no local `uses:`, because the release workflow calls it.
# The build also builds the frame assets (scripts/build-frame.mjs) and rewrites the two committed manifests, so right
# after it a fresh frame build must equal what it wrote (--check) and git must see neither manifest moved: a change
# that moves an asset's hash without its rebuilt manifests is red. npm pack runs the prepack check
# (scripts/verify-assets.mjs: every byte under assets/ is the one assets/assets.json names), and the smoke installs
# the tarball whose name npm pack --json gives, never a name spelled from the version.
# The release workflow (release.yml) runs this workflow as its test job, through workflow_call with no inputs and no
# secrets, at the tag's commit: the same steps as a push, on both Node legs, under the token the caller grants it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# In a called run the github context is the caller's, so the group names the calling workflow too: the release's call
# (github.ref refs/heads/main on its dry run) never shares main's own group, where a newer pending run would cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.node }})
    runs-on: ubuntu-latest
    # The install step's worst case (22 minutes, two stalled attempts) plus the suite (36.4 minutes measured on
    # 2026-10-28) with a quarter of headroom; test/ci-workflow.test.ts holds the sum.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: the pinned playwright-core version, the runner's OS release, the ISO week, the browser directory and apt's archive directory
        id: playwright
        run: |
          version="$(node -p "require('./package.json').devDependencies['playwright-core']")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          os="$(unset ID VERSION_ID && . /etc/os-release && echo "${ID:?}${VERSION_ID:?}")"
          [[ "$os" =~ ^[a-z0-9._-]+$ ]]
          week="$(date -u +%G-W%V)"
          [[ "$week" =~ ^[0-9]{4}-W[0-9]{2}$ ]]
          browsers="${XDG_CACHE_HOME:-${HOME:?}/.cache}/ms-playwright"
          archives=/var/cache/docserver-apt-archives
          printf '%s\n' "version=$version" "os=$os" "week=$week" "browsers=$browsers" "archives=$archives" >> "$GITHUB_OUTPUT"
      - name: apt retries and timeouts
        env:
          ARCHIVES: ${{ steps.playwright.outputs.archives }}
        run: |
          [[ "${ARCHIVES:?}" =~ ^/[A-Za-z0-9._/-]+$ ]]
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 "$ARCHIVES" "$ARCHIVES/partial"
          sudo -u _apt test -x "$ARCHIVES/partial" || {
            echo "::error::_apt cannot reach $ARCHIVES/partial, so apt would download as root, unsandboxed"
            exit 1
          }
          printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            'DPkg::Lock::Timeout "300";' \
            'APT::Keep-Downloaded-Packages "true";' "Dir::Cache::Archives \"$ARCHIVES/\";" \
            | sudo tee /etc/apt/apt.conf.d/80-docserver-ci > /dev/null
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.playwright.outputs.browsers }}
          key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.os }}-playwright-core-${{ steps.playwright.outputs.version }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.playwright.outputs.archives }}
          key: apt-archives-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.os }}-playwright-core-${{ steps.playwright.outputs.version }}-${{ steps.playwright.outputs.week }}
          restore-keys: apt-archives-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.os }}-playwright-core-${{ steps.playwright.outputs.version }}-
      - name: install the pinned browsers and their system libraries
        timeout-minutes: 22
        run: |
          for attempt in 1 2; do
            if [ "$attempt" = 2 ]; then
              sudo pkill -TERM -x 'apt-get|dpkg' || true
              sleep 5
              sudo pkill -KILL -x 'apt-get|dpkg' || true
              sudo timeout -k 5 40 dpkg --configure -a || echo "::warning::dpkg --configure -a failed before browser install attempt 2"
            fi
            if timeout -k 30 600 npx playwright-core install --with-deps chromium webkit; then
              exit 0
            fi
            echo "::warning::browser install attempt ${attempt} of 2 failed or timed out"
          done
          exit 1
      - name: the apt archive cache is readable for its save
        env:
          ARCHIVES: ${{ steps.playwright.outputs.archives }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" "${ARCHIVES:?}"
          chmod -R u+rwX "$ARCHIVES"
      - run: npm run typecheck
      - run: ./node_modules/.bin/vitest run
      - name: the tests wrote no layout snapshot
        run: test -z "$(git status --porcelain -- conformance/layout)"
      - run: npm run build
      - run: node scripts/build-frame.mjs --check
      - run: git diff --exit-code -- assets/assets.json src/frame/
      - name: ratchet
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.event_name == 'push' && 'HEAD^' || 'origin/main' }}
        run: node scripts/ratchet.mjs --base "${BASE}"
      - name: pack, naming the tarball from npm pack --json
        id: pack
        run: |
          npm pack --json > "${RUNNER_TEMP:?}/pack.json"
          tarball="$(node -e 'const [p] = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); process.stdout.write(String(p.filename))' "$RUNNER_TEMP/pack.json")"
          [[ "$tarball" =~ ^[a-z0-9][a-z0-9._-]*\.tgz$ ]]
          test -f "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: consumer smoke on the packed tarball
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node scripts/consumer-smoke.mjs "./${TARBALL:?}"
